<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transmissor de Tela</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 30px 16px;
  }
  h1 { margin-bottom: 6px; }
  .sub { color: #888; margin-bottom: 24px; font-size: 14px; }
  .card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 480px;
    text-align: center;
  }
  #meuId {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #4ade80;
    margin: 12px 0;
    word-break: break-all;
  }
  button {
    background: #4ade80;
    color: #0f0f0f;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
  }
  button:disabled { background: #333; color: #888; cursor: not-allowed; }
  button:hover:not(:disabled) { opacity: 0.9; }
  #status {
    margin-top: 16px;
    font-size: 12px;
    color: #aaa;
    text-align: left;
    background: #000;
    padding: 10px;
    border-radius: 8px;
    max-height: 160px;
    overflow-y: auto;
    font-family: monospace;
  }
  video {
    width: 100%;
    max-width: 480px;
    margin-top: 20px;
    border-radius: 12px;
    border: 1px solid #2a2a2a;
    background: #000;
  }
</style>
</head>
<body>

  <h1>📡 Transmissor de Tela</h1>
  <p class="sub">Compartilhe seu código com quem vai assistir</p>

  <div class="card">
    <div>Seu código de transmissão:</div>
    <div id="meuId">gerando...</div>
    <button id="btnCompartilhar" disabled>Iniciar compartilhamento de tela</button>
    <div id="status">Conectando ao servidor...</div>
  </div>

  <video id="preview" autoplay muted playsinline></video>

  <script>
    const log = (msg) => {
      const el = document.getElementById('status');
      const linha = document.createElement('div');
      linha.textContent = `${new Date().toLocaleTimeString()} — ${msg}`;
      el.prepend(linha);
    };

    const peer = new Peer(); // servidor gratuito público do PeerJS
    const meuIdEl = document.getElementById('meuId');
    const btn = document.getElementById('btnCompartilhar');
    const preview = document.getElementById('preview');

    let localStream = null;

    peer.on('open', (id) => {
      meuIdEl.textContent = id;
      btn.disabled = false;
      log('Conectado ao servidor. Pronto para compartilhar.');
    });

    peer.on('disconnected', () => {
      log('Desconectado do servidor de sinalização. Tentando reconectar...');
      peer.reconnect();
    });

    peer.on('error', (err) => {
      log(`Erro: ${err.type} — ${err.message || ''}`);
      console.error(err);
    });

    // Quando o receptor pedir conexão de dados, respondemos ligando com o vídeo real
    peer.on('connection', (dataConn) => {
      log(`Espectador conectando (${dataConn.peer})`);

      dataConn.on('open', () => {
        if (!localStream) {
          log('Espectador pediu conexão mas o compartilhamento ainda não foi iniciado.');
          dataConn.send('erro: transmissor ainda não iniciou o compartilhamento');
          return;
        }
        log('Enviando stream de vídeo para o espectador...');
        const call = peer.call(dataConn.peer, localStream);

        call.on('close', () => log('Espectador desconectou'));
        call.on('error', (err) => log(`Erro na chamada: ${err}`));
      });
    });

    btn.addEventListener('click', async () => {
      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            frameRate: { ideal: 30, max: 60 },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });

        preview.srcObject = localStream;
        btn.disabled = true;
        btn.textContent = 'Compartilhamento ativo';
        log('Compartilhamento de tela iniciado. Aguardando espectadores.');

        localStream.getVideoTracks()[0].addEventListener('ended', () => {
          btn.disabled = false;
          btn.textContent = 'Iniciar compartilhamento de tela';
          localStream = null;
          log('Compartilhamento encerrado pelo usuário.');
        });

      } catch (err) {
        console.error(err);
        log(`Permissão negada ou cancelada: ${err.message || err}`);
      }
    });
  </script>
</body>
</html>
